[pytest]
markers =
    integration: Integration tests
    cc: Cisco Catalyst Center tests
    cc_2379: Catalyst Center version 2.3.7.9 tests
    cc_23710: Catalyst Center version 2.3.7.10 tests
    terraform: Terraform deployment tests
    single_state: Single-state deployment tests (all resources in one state)
    multi_state: Multi-state deployment tests (GLOBAL + SITE states)
    global_state: Global/common state deployment (credentials, IP pools, system settings)
    site_state: Site-specific state deployment (fabric, sites, devices)
    cleanup: Cleanup tests that destroy infrastructure
    validate: Validation tests
    run: Test execution order (requires pytest-ordering plugin)
    use_bulk_api: Tests using provider bulk API endpoints
filterwarnings =
    ignore::DeprecationWarning:robot.utils
