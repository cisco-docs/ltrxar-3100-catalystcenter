# ============================================================================
# MULTIDOMAIN OVERLAY — SDA fabric topology + L3 handoffs to SDWAN
#
# This file is COMMENTED OUT by default. The catc standalone deploy ignores
# it at Phase 1. Activates in Phase 2 paired with multidomain_devices.nac.yaml.
#
# Phase plan:
#   Phase 1: file body fully commented. No fabric, no L3 handoffs.
#   Phase 2: uncomment the entire YAML body below. This creates fabric_sites,
#            l3_virtual_networks, transit definitions, and border_devices
#            (L3 handoff IP transits) in one shot.
#            NOTE: with multidomain_devices.nac.yaml state: INIT, BGP
#            handoffs will exist in CC config but won't establish (no
#            fabric devices yet). Phase 3 fixes this.
#   Phase 3: multidomain_devices.nac.yaml flips INIT → PROVISION. Devices
#            join fabric with declared fabric_roles, border_devices then
#            push the BGP handoff config to BORDER.cisco.eu and FIAB.cisco.eu.
#            BGP comes up to SDWAN cEdges (10.100.30.2 / 10.100.50.2).
#
# Topology:
#   Bld A = Fabric A: Campus VN with two anycast gateways (IT_Admin, Servers)
#   Bld B = Fabric B: IoT VN with one anycast gateway (Cameras)
#
# Each anycast gateway carries security_group_name (the default SG for hosts
# in the pool) and group_based_policy_enforcement_enabled (the on-switch
# enforcement toggle that downloads the ISE matrix).
#
# Campus VN and IoT VN both terminate into SDWAN VPN30 at the L3 handoff
# (border_devices block at the bottom). Cross-fabric L3 reachability is
# therefore open; SGT alone provides segmentation between Cameras, IT_Admin,
# and Servers.
#
# In VS Code: select the YAML body block, Cmd/Ctrl+/.
# ============================================================================

---
catalyst_center:
  fabric:
    l3_virtual_networks:
      - name: Campus
      - name: IoT

    transits:
      - name: BGP-SDWAN
        type: IP_BASED_TRANSIT
        routing_protocol_name: BGP
        autonomous_system_number: 65200

    fabric_sites:
      # ─────────────────────── Fabric A ───────────────────────
      - name: Global/USA/Nevada/Las Vegas/Bld A
        authentication_template:
          name: No Authentication
        pub_sub_enabled: true
        l3_virtual_networks:
          - Campus
        anycast_gateways:
          - ip_pool_name: EmployeesPool
            vlan_name: VLAN_EMPLOYEES
            traffic_type: DATA
            l3_virtual_network: Campus
            security_group_name: IT_Admin
            group_based_policy_enforcement_enabled: true
          - ip_pool_name: ServersPool
            vlan_name: VLAN_SERVERS
            traffic_type: DATA
            l3_virtual_network: Campus
            security_group_name: Servers
            group_based_policy_enforcement_enabled: true

      # ─────────────────────── Fabric B ───────────────────────
      - name: Global/USA/Nevada/Las Vegas/Bld B
        authentication_template:
          name: No Authentication
        pub_sub_enabled: true
        l3_virtual_networks:
          - IoT
        anycast_gateways:
          - ip_pool_name: IoTPool
            vlan_name: VLAN_CAMERAS
            traffic_type: DATA
            l3_virtual_network: IoT
            security_group_name: Cameras
            group_based_policy_enforcement_enabled: true

    border_devices:
      # ─────────────────────── Fabric A ───────────────────────
      - name: BORDER.cisco.eu
        border_types:
          - LAYER_3
        default_exit: true
        import_external_routes: false
        local_autonomous_system_number: 65001
        l3_handoffs:
          - name: BGP-SDWAN
            interfaces:
              - name: GigabitEthernet1/0/24
                virtual_networks:
                  - name: Campus
                    vlan: 3010
                    local_ip_address: 10.100.30.1/30
                    peer_ip_address: 10.100.30.2/30
                    tcp_mss_adjustment: 1350

      # ─────────────────────── Fabric B ───────────────────────
      - name: FIAB.cisco.eu
        border_types:
          - LAYER_3
        default_exit: true
        import_external_routes: false
        local_autonomous_system_number: 65002
        l3_handoffs:
          - name: BGP-SDWAN
            interfaces:
              - name: GigabitEthernet1/0/24
                virtual_networks:
                  - name: IoT
                    vlan: 3050
                    local_ip_address: 10.100.50.1/30
                    peer_ip_address: 10.100.50.2/30
                    tcp_mss_adjustment: 1350
