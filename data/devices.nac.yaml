---
# BR10 (border node + control plane) is owned by multi-domain/catc/.
# This repo declares only the SDA edge nodes EDGE01 and EDGE02 for the
# standalone (Module 3) demo. The fabric site keeps the Campus + Guest VNs;
# border handoff and transits are layered on by multi-domain/catc/.
catalyst_center:
  inventory:
    devices:
      - name: EDGE01
        fqdn_name: EDGE01.cisco.eu
        device_ip: 198.18.130.1
        pid: C9KV-UADP-8P
        state: INIT
        device_role: ACCESS
        site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_site: Global/USA/Nevada/Las Vegas
        fabric_roles:
          - EDGE_NODE
        port_assignments:
          - interface_name: GigabitEthernet1/0/2
            connected_device_type: "USER_DEVICE"
            data_vlan_name: "192_168_100_0-Campus"
            authenticate_template_name: "No Authentication"
      - name: EDGE02
        fqdn_name: EDGE02.cisco.eu
        device_ip: 198.18.130.2
        pid: C9KV-UADP-8P
        state: INIT
        device_role: ACCESS
        site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_site: Global/USA/Nevada/Las Vegas
        fabric_roles:
          - EDGE_NODE
        port_assignments:
          - interface_name: GigabitEthernet1/0/3
            connected_device_type: "USER_DEVICE"
            data_vlan_name: "192_168_100_0-Campus"
            authenticate_template_name: "No Authentication"
