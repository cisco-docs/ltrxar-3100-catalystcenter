---
# Two fabric sites under one Catalyst Center (multi-fabric pattern):
#   Bld A = SDA Fabric A (BORDER + SDA-EDGE-01 + SDA-EDGE-02)
#   Bld B = SDA Fabric B (FIAB only — fabric-in-a-box, all 3 roles)
# AAA + telemetry inherit from Las Vegas. IP pool reservations must be at
# the fabric site (building) level — CC rejects AGW creation against pools
# only reserved at parent area level.
catalyst_center:
  sites:
    areas:
      - name: Global
      - name: USA
        parent_name: Global
      - name: Nevada
        parent_name: Global/USA
      - name: Las Vegas
        parent_name: Global/USA/Nevada
        network_settings:
          aaa_servers: AAA_Settings
          telemetry: FABRIC_TELEMETRY
    buildings:
      - name: Bld A
        latitude: 36.1699
        longitude: -115.1398
        country: United States
        parent_name: Global/USA/Nevada/Las Vegas
        # ip_pools_reservations:
        #   - EmployeesPool
        #   - ServersPool
      - name: Bld B
        latitude: 36.1699
        longitude: -115.1398
        country: United States
        parent_name: Global/USA/Nevada/Las Vegas
        # ip_pools_reservations:
        #   - IoTPool
    floors:
      - name: FLOOR_1
        floor_number: 1
        parent_name: Global/USA/Nevada/Las Vegas/Bld A
      - name: FLOOR_2
        floor_number: 2
        parent_name: Global/USA/Nevada/Las Vegas/Bld A
      - name: FLOOR_1
        floor_number: 1
        parent_name: Global/USA/Nevada/Las Vegas/Bld B
