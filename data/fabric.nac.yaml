---
# Fabric site, VNs, and anycast gateways for the standalone (Module 3) demo.
# Transits and border_devices (BR10 + L3 handoff) are owned by multi-domain/catc/.
catalyst_center:
  fabric:
    l3_virtual_networks:
      - name: Campus
      - name: Guest
    fabric_sites:
      - name: Global/USA/Nevada/Las Vegas
        authentication_template:
          name: No Authentication
        pub_sub_enabled: true
        l3_virtual_networks:
          - Campus
          - Guest
        anycast_gateways:
          - ip_pool_name: CampusVN-IPPool
            auto_generate_vlan_name: true
            traffic_type: DATA
            l3_virtual_network: Campus
          - ip_pool_name: GuestVN-IPPool
            auto_generate_vlan_name: true
            traffic_type: DATA
            l3_virtual_network: Guest
