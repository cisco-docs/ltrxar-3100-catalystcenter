# ============================================================================
# MULTIDOMAIN OVERLAY — SDA fabric device inventory
#
# This file is COMMENTED OUT by default. The catc standalone deploy ignores
# this file at Phase 1. It activates in Phase 2 as part of the multidomain
# rollout (paired with data/multidomain_fabric.nac.yaml).
#
# Phase plan:
#   Phase 1: file body fully commented. Catc deploys foundation only (sites,
#            network_settings, templates library, IP pools).
#   Phase 2: uncomment the entire YAML body below.
#            In VS Code: select the YAML body block, Cmd/Ctrl+/.
#            Devices land in CC with state: INIT — terraform asserts they
#            exist in inventory but does NOT push provisioning config.
#            fabric_roles becomes active immediately.
#   Phase 3: flip every `state: INIT` to `state: PROVISION`. Devices get
#            baseline config push + fabric membership + L3 handoffs (the
#            border_devices block in multidomain_fabric.nac.yaml). BGP comes
#            up end-to-end with SDWAN cEdges.
#   Phase 4: uncomment per-device `port_assignments:` and `dayn_templates:`.
#            Then manually push `cts credentials id <name> password <pw>` per
#            device after CTS PAC provisioning completes (see header of
#            data/templates/cts-bootstrap.j2).
#
# Fabric A:
#   BORDER.cisco.eu     BORDER + CP   (handles L3 egress + LISP map server)
#   EDGE01.cisco.eu     EDGE          (Gi1/0/1 → laptop, VLAN_EMPLOYEES)
#   EDGE02.cisco.eu     EDGE          (Gi1/0/1 → server, VLAN_SERVERS)
#
# Fabric B:
#   FIAB.cisco.eu       BORDER + CP + EDGE  (FIAB, Gi1/0/1 → camera, VLAN_CAMERAS)
#
# Why CP must be co-located with BORDER (not EDGE): CC requires
# CONTROL_PLANE_NODE in the fabric before any EDGE_NODE can be added, AND
# CP+EDGE alone is rejected. So BORDER.cisco.eu owns CP for Fabric A.
# ============================================================================

---
catalyst_center:
  inventory:
    devices:
      # ─────────────────────── Fabric A ───────────────────────
      - name: BORDER.cisco.eu
        fqdn_name: BORDER.cisco.eu
        device_ip: 198.18.140.31
        pid: C9KV-UADP-8P
        state: PROVISION  # Phase 3: flip to PROVISION
        device_role: BORDER ROUTER
        site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_roles:
          - BORDER_NODE
          - CONTROL_PLANE_NODE
        # Phase 4: uncomment to push CTS bootstrap template
        dayn_templates:
          regular:
            - name: cts-bootstrap
              variables:
                - name: device_name
                  value: BORDER.cisco.eu
                - name: cts_password
                  value: C1sco12345

      - name: EDGE01.cisco.eu
        fqdn_name: EDGE01.cisco.eu
        device_ip: 198.18.140.32
        pid: C9KV-UADP-8P
        state: PROVISION  # Phase 3: flip to PROVISION
        device_role: ACCESS
        site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_roles:
          - EDGE_NODE
        # Phase 4: uncomment for access port + CTS template
        port_assignments:
          - interface_name: GigabitEthernet1/0/1
            connected_device_type: USER_DEVICE
            data_vlan_name: VLAN_EMPLOYEES
            authenticate_template_name: "No Authentication"
        dayn_templates:
          regular:
            - name: cts-bootstrap
              variables:
                - name: device_name
                  value: EDGE01.cisco.eu
                - name: cts_password
                  value: C1sco12345

      - name: EDGE02.cisco.eu
        fqdn_name: EDGE02.cisco.eu
        device_ip: 198.18.140.33
        pid: C9KV-UADP-8P
        state: PROVISION  # Phase 3: flip to PROVISION
        device_role: ACCESS
        site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_roles:
          - EDGE_NODE
        # Phase 4: uncomment for access port + CTS template
        port_assignments:
          - interface_name: GigabitEthernet1/0/1
            connected_device_type: USER_DEVICE
            data_vlan_name: VLAN_SERVERS
            authenticate_template_name: "No Authentication"
        dayn_templates:
          regular:
            - name: cts-bootstrap
              variables:
                - name: device_name
                  value: EDGE02.cisco.eu
                - name: cts_password
                  value: C1sco12345

      # ─────────────────────── Fabric B ───────────────────────
      - name: FIAB.cisco.eu
        fqdn_name: FIAB.cisco.eu
        device_ip: 198.18.140.34
        pid: C9KV-UADP-8P
        state: PROVISION  # Phase 3: flip to PROVISION
        device_role: BORDER ROUTER
        site: Global/USA/Nevada/Las Vegas/Bld B
        fabric_site: Global/USA/Nevada/Las Vegas/Bld B
        fabric_roles:
          - BORDER_NODE
          - CONTROL_PLANE_NODE
          - EDGE_NODE
        # Phase 4: uncomment for access port + CTS template
        port_assignments:
          - interface_name: GigabitEthernet1/0/1
            connected_device_type: USER_DEVICE
            data_vlan_name: VLAN_CAMERAS
            authenticate_template_name: "No Authentication"
        dayn_templates:
          regular:
            - name: cts-bootstrap
              variables:
                - name: device_name
                  value: FIAB.cisco.eu
                - name: cts_password
                  value: C1sco12345
