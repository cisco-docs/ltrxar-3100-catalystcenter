---
image: danischm/nac:latest
stages:
  - validate
  - plan
  - deploy
  - test
  - notify
  - destroy

variables:
  GIT_SSL_NO_VERIFY: "true"

  CC_USERNAME:
    description: "Cisco Catalyst Center Username"
  CC_PASSWORD:
    description: "Cisco Catalyst Center Password"
  CC_URL:
    description: "Cisco Catalyst Center URL"
  GITLAB_TOKEN:
    description: "User Access Token. Used to create comments on Merge Requests"
  TF_HTTP_USERNAME:
    description: "GitLab Username"
    value: "gitlab-ci-token"
  TF_HTTP_PASSWORD:
    description: "GitLab Access Token"
    value: "${CI_JOB_TOKEN}"
  GITLAB_API_URL:
    description: "GitLab API v4 root URL"
    value: "${CI_API_V4_URL}"
  TF_HTTP_ADDRESS:
    description: "GitLab HTTP Address to store the TF state file"
    value: "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/terraform/state/tfstate"
  TF_HTTP_LOCK_ADDRESS:
    description: "GitLab HTTP Address to lock the TF state file"
    value: ${TF_HTTP_ADDRESS}/lock
  TF_HTTP_LOCK_METHOD:
    description: "Method to lock TF state file"
    value: POST
  TF_HTTP_UNLOCK_ADDRESS:
    description: "GitLab HTTP Address to unlock the TF state file"
    value: ${TF_HTTP_ADDRESS}/lock
  TF_HTTP_UNLOCK_METHOD:
    description: "Method to unlock TF state file"
    value: DELETE

cache:
  key: terraform_modules_and_lock
  paths:
    - .terraform
    - .terraform.lock.hcl
    - defaults.yaml

validate:
  stage: validate
  script:
    - set -o pipefail && terraform fmt -check |& tee fmt_output.txt
    - set -o pipefail && nac-validate ./data/ --rules ./validation/rules |& tee validate_output.txt
  artifacts:
    paths:
      - fmt_output.txt
      - validate_output.txt
  cache: []
  rules:
    - if: $CI_COMMIT_TAG == null

plan:
  stage: plan
  resource_group: catc
  script:
    - terraform version
    - terraform init -upgrade -input=false
    - terraform providers
    - terraform plan -out=plan.tfplan -input=false
    - terraform show -no-color plan.tfplan > plan.txt
    - terraform show -json plan.tfplan | jq > plan.json
    - terraform show -json plan.tfplan | jq '([.resource_changes[]?.change.actions?]|flatten)|{"create":(map(select(.=="create"))|length),"update":(map(select(.=="update"))|length),"delete":(map(select(.=="delete"))|length)}' > plan_gitlab.json
    - python3 .ci/gitlab-comment.py
  artifacts:
    paths:
      - plan.json
      - plan.txt
      - plan.tfplan
      - plan_gitlab.json
    reports:
      terraform: plan_gitlab.json
  dependencies: []
  needs:
    - validate
  only:
    - master
    - merge_requests
  except:
    - tags

deploy:
  stage: deploy
  resource_group: catc
  when: manual
  allow_failure: false
  script:
    - export TF_LOG=DEBUG
    - export TF_LOG_PATH=terraform-debug.log
    - terraform apply -input=false -auto-approve plan.tfplan
    - echo "--- TF DEBUG LOG START ---"
    - cat terraform-debug.log || echo "No debug log found"
    - echo "--- TF DEBUG LOG END ---"
    - echo "--- TERRAFORM OUTPUTS ---"
    - terraform output > all_outputs.txt || echo "No outputs found"
  artifacts:
    paths:
      - ./defaults/defaults.yaml
      - terraform-debug.log
      - all_outputs.txt
    when: always
    expire_in: 1 week
  dependencies:
    - plan
  needs:
    - plan
  only:
    - master
    - merge_requests
  except:
    - tags

test:
  stage: test
  script:
    - set -o pipefail && nac-test -d ./data -d ./defaults -t ./templates/catalyst_center/test -o ./tests/results/catalyst_center |& tee test_output.txt
  artifacts:
    when: always
    paths:
      - tests/results/catalyst_center/*.html
      - tests/results/catalyst_center/xunit.xml
      - test_output.txt
    reports:
      junit: tests/results/catalyst_center/xunit.xml
  dependencies:
    - deploy
  needs:
    - deploy
  only:
    - master
    - merge_requests

failure:
  stage: notify
  script:
    - python3 .ci/webex-notification-gitlab.py -f
  when: on_failure
  artifacts:
    when: always
    paths:
      - tests/results/catalyst_center/*.html
      - tests/results/catalyst_center/xunit.xml
      - plan.txt
      - fmt_output.txt
      - validate_output.txt
      - test_output.txt
  cache: []

success:
  stage: notify
  script:
    - python3 .ci/webex-notification-gitlab.py -s
  when: on_success
  artifacts:
    when: always
    paths:
      - tests/results/catalyst_center/*.html
      - tests/results/catalyst_center/xunit.xml
      - plan.txt
      - fmt_output.txt
      - validate_output.txt
      - test_output.txt
  cache: []

destroy:
  stage: destroy
  script:
    - terraform init
    - terraform destroy -auto-approve
  rules:
    - if: "$CI_COMMIT_TAG =~ /^cleanup-catc/"
      when: always
