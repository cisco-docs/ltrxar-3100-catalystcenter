    ap_profiles:
      - name: TEST_AP_PROFILE
        description: Test AP profile for integration testing
        awips_enabled: true
        awips_forensic_enabled: true
        rogue_detection: true
        rogue_detection_min_rssi: -85
        rogue_detection_report_interval: 60
        pmf_denial_enabled: true
        mesh_enabled: true
        bridge_group_name: "Default"
        backhaul_client_access: true
        range: 12000
        ghz5_backhaul_data_rates: 802.11ax
        ghz24_backhaul_data_rates: 802.11n
        rap_downlink_backhaul: "2.4 GHz"
        calendar_power_profiles:
          - power_profile: Low_Power_Profile
            scheduler_type: DAILY
            scheduler_start_time: "22:00"
            scheduler_end_time: "06:00"
        country_code: IN
        time_zone: Delta from Controller
        time_zone_offset_hour: 5
        time_zone_offset_minutes: 30
    rf_profiles:
      - name: BASIC_PROFILE_1
        enable_radio_type_a: true
        enable_radio_type_b: false
        enable_radio_type_c: false
        radio_type_a_properties:
          parent_profile: CUSTOM
          radio_channels: 36,40,44,48,52,56,60,64,144,149,153,157,161,165,169,173
          data_rates: 12,18,24,36,48,54
          mandatory_data_rates: 12,24
          power_threshold_v1: -60
          rx_sop_threshold: LOW
          min_power_level: 8
          max_power_level: 30
    power_profiles:
      - name: "Low_Power_Profile"
        description: "Low power mode for energy savings"
        rules:
          - interface_type: RADIO
            interface_id: 6GHZ
            parameter_type: STATE
            parameter_value: DISABLE
          - interface_type: ETHERNET
            interface_id: GIGABITETHERNET0
            parameter_type: SPEED
            parameter_value: 1000MBPS
          - interface_type: RADIO
            interface_id: 5GHZ
            parameter_type: SPATIALSTREAM
            parameter_value: TWO_BY_TWO
    anchor_groups:
      - name: "AG_Guest"
        mobility_anchors:
          - device_name: EXT-WLC1
            ip_address: 172.16.61.1
            anchor_priority: PRIMARY
            managed_anchor_wlc: false
            peer_device_type: IOS-XE
            mac_address: "aa:bb:cc:00:00:01"
            mobility_group_name: default
          - device_name: EXT-WLC2
            ip_address: 172.16.61.2
            anchor_priority: SECONDARY
            managed_anchor_wlc: false
            peer_device_type: IOS-XE
            mac_address: "aa:bb:cc:00:00:02"
            mobility_group_name: default
