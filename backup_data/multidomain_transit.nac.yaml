# ============================================================================
# MULTIDOMAIN ADDITIONS — for Cisco Live LTRXAR-3100 multidomain demo
#
# This file is COMMENTED OUT by default. Uncomment the block below to
# activate this resource as part of the multidomain rollout.
#
# To uncomment: select the YAML block in your editor and toggle comments
# (Cmd/Ctrl+/ in VS Code), or run from a shell:
#   sed -i 's/^# //' <this-file>
# ============================================================================

---
# Shared IP transit toward the SDWAN overlay (AS 65200).
# Both Fabric A (BORDER) and Fabric B (FIAB) consume this transit on their
# respective L3 handoffs. One transit object, two consumers.
catalyst_center:
  fabric:
    transits:
      - name: BGP-SDWAN
        type: IP_BASED_TRANSIT
        routing_protocol_name: BGP
        autonomous_system_number: 65200
